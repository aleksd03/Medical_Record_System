<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Sick Leave</title>
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<h1>Edit Sick Leave</h1>

<form th:action="@{/sick-leaves/edit/{id}(id=${sickLeaveId})}" th:object="${sickLeave}" method="post">
    <div>
        <label>Start Date:</label>
        <input type="date" th:field="*{startDate}"/>
    </div>
    <div>
        <label>Number of Days:</label>
        <input type="number" th:field="*{numberOfDays}"/>
    </div>
    <div>
        <label>Appointment:</label>
        <select th:field="*{appointmentId}">
            <option th:each="appointment : ${appointments}"
                    th:value="${appointment.id}"
                    th:text="${appointment.id + ' - ' + appointment.date}">
            </option>
        </select>
    </div>
    <button type="submit">Save</button>
    <a th:href="@{/sick-leaves}">Back</a>
</form>

</body>
</html>
