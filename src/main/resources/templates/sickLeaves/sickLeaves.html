<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sick Leaves</title>
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<h1>Sick Leaves</h1>

<a th:href="@{/sick-leaves/create}">Add Sick Leave</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Start Date</th>
        <th>Number of Days</th>
        <th>Appointment</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="sickLeave : ${sickLeaves}">
        <td th:text="${sickLeave.id}"></td>
        <td th:text="${sickLeave.startDate}"></td>
        <td th:text="${sickLeave.numberOfDays}"></td>
        <td th:text="${sickLeave.appointment.id}"></td>
        <td>
            <a th:href="@{/sick-leaves/edit/{id}(id=${sickLeave.id})}">Edit</a>
            <a th:href="@{/sick-leaves/delete/{id}(id=${sickLeave.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
