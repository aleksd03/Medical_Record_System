<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Doctors</title>
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<h1>Doctors</h1>

<a th:href="@{/doctors/create}">Add Doctor</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Identification Number</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="doctor : ${doctors}">
        <td th:text="${doctor.id}"></td>
        <td th:text="${doctor.identificationNumber}"></td>
        <td th:text="${doctor.firstName}"></td>
        <td th:text="${doctor.lastName}"></td>
        <td>
            <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}">Edit</a>
            <a th:href="@{/doctors/delete/{id}(id=${doctor.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
