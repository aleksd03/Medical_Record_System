<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Diagnoses</title>
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<h1>Diagnoses</h1>

<a th:href="@{/diagnoses/create}">Add Diagnosis</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="diagnosis : ${diagnoses}">
        <td th:text="${diagnosis.id}"></td>
        <td th:text="${diagnosis.name}"></td>
        <td th:text="${diagnosis.description}"></td>
        <td>
            <a th:href="@{/diagnoses/edit/{id}(id=${diagnosis.id})}">Edit</a>
            <a th:href="@{/diagnoses/delete/{id}(id=${diagnosis.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
