<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointment Count by Doctor</title>
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<h1>Appointment Count by Doctor</h1>
<table>
    <thead>
    <tr>
        <th>Doctor</th>
        <th>Appointment Count</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="entry : ${data}">
        <td th:text="${entry.key.firstName + ' ' + entry.key.lastName}"></td>
        <td th:text="${entry.value}"></td>
    </tr>
    </tbody>
</table>
<a th:href="@{/statistics}">Back</a>

</body>
</html>
