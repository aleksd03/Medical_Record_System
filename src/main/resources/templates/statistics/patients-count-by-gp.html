<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patient Count by GP</title>
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<h1>Patient Count by General Practitioner</h1>
<table>
    <thead>
    <tr>
        <th>General Practitioner</th>
        <th>Patient Count</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="entry : ${data}">
        <td th:text="${entry.key.firstName + ' ' + entry.key.lastName}"></td>
        <td th:text="${entry.value}"></td>
    </tr>
    </tbody>
</table>
<a th:href="@{/statistics}">Back</a>

</body>
</html>
