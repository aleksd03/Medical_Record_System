<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Appointments</title>
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>

<h1>Appointments</h1>

<a th:href="@{/appointments/create}">Add Appointment</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Date</th>
        <th>Doctor</th>
        <th>Patient</th>
        <th>Diagnosis</th>
        <th>Treatment</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="appointment : ${appointments}">
        <td th:text="${appointment.id}"></td>
        <td th:text="${appointment.date}"></td>
        <td th:text="${appointment.doctor.firstName + ' ' + appointment.doctor.lastName}"></td>
        <td th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName}"></td>
        <td th:text="${appointment.diagnosis.name}"></td>
        <td th:text="${appointment.treatment}"></td>
        <td th:text="${appointment.price}"></td>
        <td>
            <a th:href="@{/appointments/edit/{id}(id=${appointment.id})}">Edit</a>
            <a th:href="@{/appointments/delete/{id}(id=${appointment.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
